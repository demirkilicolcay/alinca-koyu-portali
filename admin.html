<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alınca Köyü Yönetim Paneli</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f6;
    color: #263238;
    padding: 30px 15px;
}

.admin-container {
    max-width: 800px;
    margin: auto;
}

.admin-header {
    background: linear-gradient(135deg, #176b52, #2e8b68);
    color: white;
    padding: 30px;
    border-radius: 18px;
    margin-bottom: 25px;
}

.admin-header h1 {
    margin-bottom: 8px;
}

.admin-header p {
    opacity: 0.9;
}

.admin-card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #176b52;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d8e1dd;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
}

.form-group textarea {
    min-height: 160px;
    resize: vertical;
}

.publish-button {
    width: 100%;
    border: none;
    background: #176b52;
    color: white;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.publish-button:hover {
    background: #2e8b68;
}

.status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    display: none;
}

.status.success {
    display: block;
    background: #e5f5ed;
    color: #176b52;
}

.status.error {
    display: block;
    background: #fdeaea;
    color: #a33;
}

.back-link {
    display: inline-block;
    margin-top: 20px;
    color: #176b52;
    text-decoration: none;
    font-weight: bold;
}

</style>

</head>

<body>
<div id="login-screen" style="
    max-width:500px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
">

    <h2 style="color:#176b52; margin-bottom:20px;">
        🔐 Yönetici Girişi
    </h2>

    <input
        type="email"
        id="login-email"
        placeholder="E-posta adresiniz"
        style="
            width:100%;
            padding:13px;
            margin-bottom:12px;
            border:1px solid #d8e1dd;
            border-radius:10px;
        "
    >

    <input
        type="password"
        id="login-password"
        placeholder="Şifreniz"
        style="
            width:100%;
            padding:13px;
            margin-bottom:15px;
            border:1px solid #d8e1dd;
            border-radius:10px;
        "
    >

    <button
        id="login-button"
        style="
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#176b52;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        "
    >
        Giriş Yap
    </button>

    <p id="login-status"
       style="margin-top:15px;">
    </p>

</div>
<div class="admin-container">

    <div class="admin-header">

        <h1>🛠️ Alınca Köyü Yönetim Paneli</h1>

        <p>Yeni haber yayınlama alanı</p>

    </div>


    <div class="admin-card">

        <form id="newsForm">

            <div class="form-group">

                <label for="baslik">
                    Haber Başlığı
                </label>

                <input
                    type="text"
                    id="baslik"
                    placeholder="Haber başlığını yazın"
                    required
                >

            </div>


            <div class="form-group">

                <label for="icerik">
                    Haber İçeriği
                </label>

                <textarea
                    id="icerik"
                    placeholder="Haber içeriğini yazın"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="tarih">
                    Haber Tarihi
                </label>

                <input
                    type="date"
                    id="tarih"
                    required
                >

            </div>


            <div class="form-group">

                <label for="resim">
                    Fotoğraf Dosya Adı
                </label>

                <input
                    type="text"
                    id="resim"
                    placeholder="Örn: alinca-haber.jpg"
                >

            </div>


            <button
                type="submit"
                class="publish-button"
            >
                📰 Haberi Yayınla
            </button>


            <div
                id="status"
                class="status"
            ></div>

        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Ana sayfaya dön
        </a>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://eyqpegahskmqvwtojlxw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xhj_vA_46DIlOkgrbTTeqQ_hsstSUYG";

    let currentUser = null;

async function checkAdmin() {

    const token =
        localStorage.getItem("supabase_access_token");

    if (!token) {
        return false;
    }

    try {

        const response = await fetch(
            `${SUPABASE_URL}/auth/v1/user`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {
            return false;
        }

        const user = await response.json();

        currentUser = user;

        return !!user.id;

    } catch (error) {

        console.error(error);

        return false;
    }
}
    checkAdmin().then(isAdmin => {

    if (isAdmin) {

        loginScreen.style.display = "none";
        adminContainer.style.display = "block";

    } else {

        loginScreen.style.display = "block";
        adminContainer.style.display = "none";

    }

});
const loginScreen =
    document.getElementById("login-screen");

const adminContainer =
    document.querySelector(".admin-container");

const loginButton =
    document.getElementById("login-button");

const loginStatus =
    document.getElementById("login-status");


adminContainer.style.display = "none";


loginButton.addEventListener("click", async function() {

    const email =
        document.getElementById("login-email").value.trim();

    const password =
        document.getElementById("login-password").value;


    if (!email || !password) {

        loginStatus.textContent =
            "⚠️ E-posta ve şifre gerekli.";

        loginStatus.style.color = "#a33";

        return;
    }


    loginStatus.textContent =
        "Giriş yapılıyor...";


    try {

        const response = await fetch(
            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.msg ||
                data.error_description ||
                "Giriş başarısız."
            );

        }


        localStorage.setItem(
            "supabase_access_token",
            data.access_token
        );


        currentUser = data.user;


        loginScreen.style.display =
            "none";

        adminContainer.style.display =
            "block";


    } catch (error) {

        console.error(error);

        loginStatus.textContent =
            "❌ E-posta veya şifre hatalı.";

        loginStatus.style.color =
            "#a33";

    }

});
const newsForm =
    document.getElementById("newsForm");

const statusBox =
    document.getElementById("status");


newsForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    statusBox.className = "status";
    statusBox.textContent = "Haber yayınlanıyor...";

    const baslik =
        document.getElementById("baslik").value.trim();

    const icerik =
        document.getElementById("icerik").value.trim();

    const tarih =
        document.getElementById("tarih").value;

    const resim =
        document.getElementById("resim").value.trim();


    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/haberler`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify({
                    baslik: baslik,
                    icerik: icerik,
                    tarih: tarih,
                    resim: resim || null
                })
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(errorText);

        }


        statusBox.className =
            "status success";

        statusBox.textContent =
            "✅ Haber başarıyla yayınlandı!";


        newsForm.reset();


    } catch (error) {

        console.error(error);

        statusBox.className =
            "status error";

        statusBox.textContent =
            "❌ Haber yayınlanamadı. Supabase izinlerini kontrol et.";

    }

});

</script>

</body>
</html>
