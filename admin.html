<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alınca Köyü Yönetim Paneli</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f6;
    color: #263238;
    padding: 30px 15px;
}

.admin-container {
    max-width: 800px;
    margin: auto;
}

.admin-header {
    background: linear-gradient(135deg, #176b52, #2e8b68);
    color: white;
    padding: 30px;
    border-radius: 18px;
    margin-bottom: 25px;
}

.admin-header h1 {
    margin-bottom: 8px;
}

.admin-header p {
    opacity: 0.9;
}

.admin-card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #176b52;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d8e1dd;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
}

.form-group textarea {
    min-height: 160px;
    resize: vertical;
}

.publish-button {
    width: 100%;
    border: none;
    background: #176b52;
    color: white;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.publish-button:hover {
    background: #2e8b68;
}

.status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    display: none;
}

.status.success {
    display: block;
    background: #e5f5ed;
    color: #176b52;
}

.status.error {
    display: block;
    background: #fdeaea;
    color: #a33;
}

.back-link {
    display: inline-block;
    margin-top: 20px;
    color: #176b52;
    text-decoration: none;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="admin-container">

    <div class="admin-header">

        <h1>🛠️ Alınca Köyü Yönetim Paneli</h1>

        <p>Yeni haber yayınlama alanı</p>

    </div>


    <div class="admin-card">

        <form id="newsForm">

            <div class="form-group">

                <label for="baslik">
                    Haber Başlığı
                </label>

                <input
                    type="text"
                    id="baslik"
                    placeholder="Haber başlığını yazın"
                    required
                >

            </div>


            <div class="form-group">

                <label for="icerik">
                    Haber İçeriği
                </label>

                <textarea
                    id="icerik"
                    placeholder="Haber içeriğini yazın"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="tarih">
                    Haber Tarihi
                </label>

                <input
                    type="date"
                    id="tarih"
                    required
                >

            </div>


            <div class="form-group">

                <label for="resim">
                    Fotoğraf Dosya Adı
                </label>

                <input
                    type="text"
                    id="resim"
                    placeholder="Örn: alinca-haber.jpg"
                >

            </div>


            <button
                type="submit"
                class="publish-button"
            >
                📰 Haberi Yayınla
            </button>


            <div
                id="status"
                class="status"
            ></div>

        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Ana sayfaya dön
        </a>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://eyqpegahskmqvwtojlxw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xhj_vA_46DIlOkgrbTTeqQ_hsstSUYG";


const newsForm =
    document.getElementById("newsForm");

const statusBox =
    document.getElementById("status");


newsForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    statusBox.className = "status";
    statusBox.textContent = "Haber yayınlanıyor...";

    const baslik =
        document.getElementById("baslik").value.trim();

    const icerik =
        document.getElementById("icerik").value.trim();

    const tarih =
        document.getElementById("tarih").value;

    const resim =
        document.getElementById("resim").value.trim();


    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/haberler`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify({
                    baslik: baslik,
                    icerik: icerik,
                    tarih: tarih,
                    resim: resim || null
                })
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(errorText);

        }


        statusBox.className =
            "status success";

        statusBox.textContent =
            "✅ Haber başarıyla yayınlandı!";


        newsForm.reset();


    } catch (error) {

        console.error(error);

        statusBox.className =
            "status error";

        statusBox.textContent =
            "❌ Haber yayınlanamadı. Supabase izinlerini kontrol et.";

    }

});

</script>

</body>
</html>
