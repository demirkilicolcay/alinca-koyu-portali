    async function loadAdminNews() {

                    "Authorization": `Bearer ${accessToken}`
                }
            }

<div style="

async function deleteNews(id) {

    const accessToken = getToken();

    if (!accessToken) {

        alert(
            "Oturumunuz sona ermiş. Lütfen tekrar giriş yapın."
        );

        showLoginScreen();

        return;
    }

    const confirmed =
        confirm(
            "Bu haberi ve haber fotoğrafını silmek istediğinize emin misiniz?"
        );

    if (!confirmed) {
        return;
    }

    try {

        /*
        =========================
        1. HABER BİLGİSİNİ AL
        =========================
        */

        const newsResponse =
            await fetch(
                `${SUPABASE_URL}/rest/v1/haberler?id=eq.${id}&select=*`,
                {
                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

        if (!newsResponse.ok) {

            const errorText =
                await newsResponse.text();

            throw new Error(
                errorText
            );
        }

        const news =
            await newsResponse.json();

        if (!news.length) {

            throw new Error(
                "Haber bulunamadı."
            );
        }

        const haber =
            news[0];

        /*
        =========================
        2. FOTOĞRAF DOSYA ADINI BUL
        =========================
        */

let dosyaAdi = null;

if (haber.resim) {

    try {

        const imageUrl =
            new URL(haber.resim);

        const marker =
            "/storage/v1/object/public/haberler/";

        const index =
            imageUrl.pathname.indexOf(marker);

        if (index !== -1) {

            dosyaAdi =
                decodeURIComponent(
                    imageUrl.pathname.substring(
                        index + marker.length
                    )
                );

        }

    } catch (error) {

        console.warn(
            "Fotoğraf URL'si çözülemedi:",
            haber.resim
        );

    }
}

        /*
        =========================
        3. FOTOĞRAFI STORAGE'DAN SİL
        =========================
        */

        if (dosyaAdi) {

            const storageResponse =
                await fetch(
                    `${SUPABASE_URL}/storage/v1/object/haberler/${encodeURIComponent(dosyaAdi)}`,
                    {
                        method: "DELETE",

                        headers: {
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );

            if (!storageResponse.ok) {

                const storageError =
                    await storageResponse.text();

                throw new Error(
                    "Fotoğraf silinemedi: " +
                    storageError
                );
            }
        }

        /*
        =========================
        4. HABERİ VERİTABANINDAN SİL
        =========================
        */

        const deleteResponse =
            await fetch(
                `${SUPABASE_URL}/rest/v1/haberler?id=eq.${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

        if (!deleteResponse.ok) {

            const errorText =
                await deleteResponse.text();

            throw new Error(
                errorText
            );
        }

        /*
        =========================
        5. BAŞARILI
        =========================
        */

        alert(
            "✅ Haber ve fotoğrafı başarıyla silindi."
        );

        loadAdminNews();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Silme işlemi başarısız:\n" +
            error.message
        );

    }

}
    async function editNews(id) {

        return;

    try {

        const response = await fetch(

            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {

            const errorText =

        }

        const news =

        });

    } catch (error) {

        console.error(error);

        alert(
            "❌ Haber bilgileri alınamadı:\n" +
            error.message
        );

    }

}

async function checkAdmin() {

const token = getToken();

if (!token) {

return false;

}

try {

const response = await fetch(
`${SUPABASE_URL}/auth/v1/user`,
{
headers: {
"apikey": SUPABASE_KEY,
"Authorization": `Bearer ${token}`
}
}
);

if (!response.ok) {

localStorage.removeItem(
"supabase_access_token"
);

return false;

}

const user =
await response.json();

return !!user.id;

} catch (error) {

console.error(error);

return false;

}

}


checkAdmin().then(function(isAdmin) {

if (isAdmin) {

showAdminPanel();

} else {

showLoginScreen();

}

});

async function loadAnnouncements() {

    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/duyurular?select=*&order=tarih.desc`,
                {
                    method: "GET",

                    headers: {

                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                "Duyurular alınamadı."
            );
        }

        const announcements =
            await response.json();

        adminAnnouncements.innerHTML = "";

        if (!announcements.length) {

            adminAnnouncements.innerHTML =
                `
                <div class="news-card">
                    Henüz yayınlanmış duyuru yok.
                </div>
                `;

            return;
        }

        announcements.forEach(
            announcement => {

                const item =
                    document.createElement("div");

                const date =
                    announcement.tarih

                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                          )
                        : "";

                item.innerHTML = `

                    <div class="news-content">

                        <div class="date">
                            ${date}
                        </div>

                adminAnnouncements.appendChild(
                    item
                );

            }
        );

        console.error(error);

async function editAnnouncement(id) {

    try {

        const accessToken =
            getToken();

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/duyurular?id=eq.${id}&select=*`,
                {
                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                "Duyuru alınamadı."
            );
        }

        const data =
            await response.json();

        if (!data.length) {

            throw new Error(
                "Duyuru bulunamadı."
            );
        }

        const announcement =
            data[0];

        document
            .getElementById("duyuru-baslik")
            .value =
                announcement.baslik || "";

        document
            .getElementById("duyuru-icerik")
            .value =
                announcement.icerik || "";

        document
            .getElementById("duyuru-tarih")
            .value =
                announcement.tarih || "";

        editingAnnouncementId.value =
            announcement.id;

        announcementSubmit.textContent =
            "💾 Değişiklikleri Kaydet";

        cancelAnnouncementEdit.style.display =
            "inline-block";

        announcementForm.scrollIntoView({
            behavior: "smooth"
        });

    } catch (error) {

        console.error(error);

        alert(
            "❌ Duyuru düzenlenemedi:\n" +
            error.message
        );

    }
}

            );

        }


        eventStatus.className =
            "status success";

        eventStatus.textContent =
            "✅ Etkinlik silindi!";


        await loadAdminEvents();


    } catch (error) {

        console.error(error);

        eventStatus.className =
            "status error";

        eventStatus.textContent =
            "❌ Etkinlik silinemedi: " +
            error.message;

    }

}

);
