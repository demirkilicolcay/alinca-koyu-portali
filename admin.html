<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alınca Köyü Yönetim Paneli</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f6;
    color: #263238;
    padding: 30px 15px;
}

.admin-container {
    max-width: 800px;
    margin: auto;
}

.admin-header {
    background: linear-gradient(135deg, #176b52, #2e8b68);
    color: white;
    padding: 30px;
    border-radius: 18px;
    margin-bottom: 25px;
}

.admin-header h1 {
    margin-bottom: 8px;
}

.admin-header p {
    opacity: 0.9;
}

.admin-card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #176b52;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d8e1dd;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
}

.form-group textarea {
    min-height: 160px;
    resize: vertical;
}

.publish-button {
    width: 100%;
    border: none;
    background: #176b52;
    color: white;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    display: none;
}

.status.success {
    display: block;
    background: #e5f5ed;
    color: #176b52;
}

.status.error {
    display: block;
    background: #fdeaea;
    color: #a33;
}

.back-link {
    display: inline-block;
    margin-top: 20px;
    color: #176b52;
    text-decoration: none;
    font-weight: bold;
}

.logout-button {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #b33;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- GİRİŞ -->

<div id="login-screen"
style="
max-width:500px;
margin:50px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
">

<h2 style="color:#176b52; margin-bottom:20px;">

type="email"

style="
width:100%;
padding:13px;
margin-bottom:12px;
border:1px solid #d8e1dd;
border-radius:10px;
">

<input
type="password"
id="login-password"
placeholder="Şifreniz"
style="
width:100%;
padding:13px;
margin-bottom:15px;
border:1px solid #d8e1dd;
border-radius:10px;
">

<button
id="login-button"
style="
width:100%;
padding:14px;
border:none;
border-radius:10px;

color:white;

font-weight:bold;
cursor:pointer;

Giriş Yap
</button>

<!-- ADMIN PANELİ -->

<div
class="admin-container"
id="admin-container"
style="display:none;"
>

<div class="admin-header">

<h1>🛠️ Alınca Köyü Yönetim Paneli</h1>

<p>Yeni haber yayınlama alanı</p>

</div>


<div class="admin-card">
    
    <input
    type="hidden"

<form id="newsForm">
<input
    type="hidden"
    id="editing-news-id"

id="baslik"

<br>

</a>

</div>

</div>


<script>

const SUPABASE_URL =
"https://eyqpegahskmqvwtojlxw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xhj_vA_46DIlOkgrbTTeqQ_hsstSUYG";


const loginScreen =
document.getElementById("login-screen");

const adminContainer =
document.getElementById("admin-container");

const loginButton =
document.getElementById("login-button");

const loginStatus =
document.getElementById("login-status");

const logoutButton =
document.getElementById("logout-button");

const newsForm =
document.getElementById("newsForm");

const statusBox =
document.getElementById("status");
    
const newsList =
    document.getElementById("news-list");

    async function loadAdminNews() {

    const accessToken = getToken();

    if (!accessToken) {
        return;
    }

    newsList.innerHTML = `
        <p style="color:#176b52;font-weight:bold;">
            Haberler yükleniyor...
        </p>
    `;

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/haberler?select=*&order=tarih.desc`,
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(errorText);
        }

        const news =
            await response.json();

        newsList.innerHTML = `
            <h2 style="
                color:#176b52;
                margin-bottom:20px;
            ">
                📰 Yayındaki Haberler
            </h2>
        `;

        if (!news.length) {

            newsList.innerHTML += `
                <p>
                    Henüz yayınlanmış haber yok.
                </p>
            `;

            return;
        }

        news.forEach(item => {

            const card =
                document.createElement("div");

            card.style.cssText = `
                background:#f8faf9;
                border:1px solid #d8e1dd;
                border-radius:12px;
                padding:18px;
                margin-bottom:15px;
            `;

            const date =
                item.tarih
                    ? new Date(item.tarih)
                        .toLocaleDateString("tr-TR")
                    : "";

            card.innerHTML = `

                <h3 style="
                    color:#176b52;
                    margin-bottom:8px;
                ">
                    ${item.baslik || ""}
                </h3>

                <p style="
                    color:#666;
                    margin-bottom:12px;
                ">
                    📅 ${date}
                </p>

                <p style="
                    margin-bottom:15px;
                ">
                    ${item.icerik || ""}
                </p>

<div style="
    display:flex;
    gap:10px;
    flex-wrap:wrap;
">

    <button
        class="edit-news-button"
        data-id="${item.id}"
        style="
            border:none;
            background:#176b52;
            color:white;
            padding:9px 15px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        ✏️ Haberi Düzenle
    </button>

    <button
        class="delete-news-button"
        data-id="${item.id}"
        style="
            border:none;
            background:#b33;
            color:white;
            padding:9px 15px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        🗑️ Haberi Sil
    </button>

</div>

            `;

            newsList.appendChild(card);

        });

        document
            .querySelectorAll(".delete-news-button")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function() {

                        const id =
                            this.dataset.id;

                        deleteNews(id);

                    }
                );

            });
        document
    .querySelectorAll(".edit-news-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                const id =
                    this.dataset.id;

                editNews(id);

            }
        );

    });

    } catch (error) {

        console.error(error);

        newsList.innerHTML = `
            <p style="color:#a33;">
                ❌ Haberler yüklenemedi:
                ${error.message}
            </p>
        `;

    }

}

async function deleteNews(id) {

    const accessToken = getToken();

    if (!accessToken) {

        alert(
            "Oturumunuz sona ermiş. Lütfen tekrar giriş yapın."
        );

        showLoginScreen();

        return;
    }

    const confirmed =
        confirm(
            "Bu haberi ve haber fotoğrafını silmek istediğinize emin misiniz?"
        );

    if (!confirmed) {
        return;
    }

    try {

        /*
        =========================
        1. HABER BİLGİSİNİ AL
        =========================
        */

        const newsResponse =
            await fetch(
                `${SUPABASE_URL}/rest/v1/haberler?id=eq.${id}&select=*`,
                {
                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

        if (!newsResponse.ok) {

            const errorText =
                await newsResponse.text();

            throw new Error(
                errorText
            );
        }

        const news =
            await newsResponse.json();

        if (!news.length) {

            throw new Error(
                "Haber bulunamadı."
            );
        }

        const haber =
            news[0];

        /*
        =========================
        2. FOTOĞRAF DOSYA ADINI BUL
        =========================
        */

        let dosyaAdi = null;

        if (haber.resim) {

            try {

                const imageUrl =
                    new URL(haber.resim);

                dosyaAdi =
                    decodeURIComponent(
                        imageUrl.pathname
                            .split("/object/public/haberler/")
                            [1]
                    );

            } catch (error) {

                console.warn(
                    "Fotoğraf URL'si çözülemedi:",
                    haber.resim
                );

            }
        }

        /*
        =========================
        3. FOTOĞRAFI STORAGE'DAN SİL
        =========================
        */

        if (dosyaAdi) {

            const storageResponse =
                await fetch(
                    `${SUPABASE_URL}/storage/v1/object/haberler/${encodeURIComponent(dosyaAdi)}`,
                    {
                        method: "DELETE",

                        headers: {
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );

            if (!storageResponse.ok) {

                const storageError =
                    await storageResponse.text();

                throw new Error(
                    "Fotoğraf silinemedi: " +
                    storageError
                );
            }
        }

        /*
        =========================
        4. HABERİ VERİTABANINDAN SİL
        =========================
        */

        const deleteResponse =
            await fetch(
                `${SUPABASE_URL}/rest/v1/haberler?id=eq.${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

        if (!deleteResponse.ok) {

            const errorText =
                await deleteResponse.text();

            throw new Error(
                errorText
            );
        }

        /*
        =========================
        5. BAŞARILI
        =========================
        */

        alert(
            "✅ Haber ve fotoğrafı başarıyla silindi."
        );

        loadAdminNews();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Silme işlemi başarısız:\n" +
            error.message
        );

    }

}
    async function editNews(id) {

    const accessToken = getToken();

    if (!accessToken) {

        alert(
            "Oturumunuz sona ermiş. Lütfen tekrar giriş yapın."
        );

        showLoginScreen();

        return;
    }

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/haberler?id=eq.${id}&select=*`,
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(errorText);
        }

        const news =
            await response.json();

        if (!news.length) {

            alert("Haber bulunamadı.");

            return;
        }

        const item = news[0];

        document.getElementById("editing-news-id").value =
            item.id;

        document.getElementById("baslik").value =
            item.baslik || "";

        document.getElementById("icerik").value =
            item.icerik || "";

        document.getElementById("tarih").value =
            item.tarih || "";

        document.getElementById("resim").value =
            "";

        const publishButton =
            document.querySelector(".publish-button");

        publishButton.textContent =
            "💾 Değişiklikleri Kaydet";

        document.getElementById(
            "cancel-edit-button"
        ).style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        console.error(error);

        alert(
            "❌ Haber bilgileri alınamadı:\n" +
            error.message
        );

    }

}
function getToken() {

return localStorage.getItem(
"supabase_access_token"
);

}


function showAdminPanel() {

loginScreen.style.display = "none";

adminContainer.style.display = "block";

    loadAdminNews();
}


function showLoginScreen() {

loginScreen.style.display = "block";

adminContainer.style.display = "none";

}


/* OTURUM KONTROLÜ */

async function checkAdmin() {

const token = getToken();

if (!token) {

return false;

}

try {

const response = await fetch(
`${SUPABASE_URL}/auth/v1/user`,
{
headers: {
"apikey": SUPABASE_KEY,
"Authorization": `Bearer ${token}`
}
}
);

if (!response.ok) {

localStorage.removeItem(
"supabase_access_token"
);

return false;

}

const user =
await response.json();

return !!user.id;

} catch (error) {

console.error(error);

return false;

}

}


checkAdmin().then(function(isAdmin) {

if (isAdmin) {

showAdminPanel();

} else {

showLoginScreen();

}

});


/* GİRİŞ */

loginButton.addEventListener(
"click",
async function() {

const email =
document
.getElementById("login-email")
.value
.trim();

const password =
document
.getElementById("login-password")
.value;

if (!email || !password) {

loginStatus.textContent =
"⚠️ E-posta ve şifre gerekli.";

loginStatus.style.color = "#a33";

return;

}

loginStatus.textContent =
"Giriş yapılıyor...";

try {

const response = await fetch(
`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
{
method: "POST",

headers: {
"Content-Type": "application/json",
"apikey": SUPABASE_KEY
},

body: JSON.stringify({
email: email,
password: password
})
}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.msg ||
data.error_description ||
data.message ||
"Giriş başarısız."
);

}

localStorage.setItem(
"supabase_access_token",
data.access_token
);

showAdminPanel();

loginStatus.textContent = "";

} catch (error) {

console.error(error);

loginStatus.textContent =
"❌ " + error.message;

loginStatus.style.color = "#a33";

}

});


/* HABER YAYINLAMA */

newsForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const accessToken = getToken();

        if (!accessToken) {

            statusBox.className =
                "status error";

            statusBox.textContent =
                "❌ Oturum bulunamadı. Lütfen tekrar giriş yapın.";

            showLoginScreen();

            return;
        }

        statusBox.className = "status";
        statusBox.textContent =
            "Haber kaydediliyor...";

        const baslik =
            document.getElementById("baslik")
                .value.trim();

        const icerik =
            document.getElementById("icerik")
                .value.trim();

        const tarih =
            document.getElementById("tarih")
                .value;

        const resimDosyasi =
            document.getElementById("resim")
                .files[0];

        const editingId =
            document.getElementById(
                "editing-news-id"
            ).value;

        try {

            /*
             =========================
             DÜZENLEME Mİ, YENİ HABER Mİ?
             =========================
            */

            if (editingId) {

                let resimUrl = null;

                /*
                 Fotoğraf seçilmişse
                 yeni fotoğraf yükle
                */

                if (resimDosyasi) {

                    const dosyaAdi =
                        Date.now() +
                        "-" +
                        resimDosyasi.name;

                    const uploadResponse =
                        await fetch(
                            `${SUPABASE_URL}/storage/v1/object/haberler/${dosyaAdi}`,
                            {
                                method: "POST",

                                headers: {
                                    "apikey":
                                        SUPABASE_KEY,

                                    "Authorization":
                                        `Bearer ${accessToken}`,

                                    "Content-Type":
                                        resimDosyasi.type
                                },

                                body:
                                    resimDosyasi
                            }
                        );

                    if (!uploadResponse.ok) {

                        const uploadError =
                            await uploadResponse.text();

                        throw new Error(
                            "Fotoğraf yüklenemedi: " +
                            uploadError
                        );
                    }

                    resimUrl =
                        `${SUPABASE_URL}/storage/v1/object/public/haberler/${dosyaAdi}`;

                }

                /*
                 =========================
                 HABERİ GÜNCELLE
                 =========================
                */

                const updateData = {

                    baslik:
                        baslik,

                    icerik:
                        icerik,

                    tarih:
                        tarih

                };

                /*
                 Yeni fotoğraf seçildiyse
                 resim alanını da güncelle
                */

                if (resimUrl) {

                    updateData.resim =
                        resimUrl;

                }

                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/haberler?id=eq.${editingId}`,
                        {
                            method: "PATCH",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`,

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify(
                                    updateData
                                )

                        }
                    );

                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText
                    );

                }

                statusBox.className =
                    "status success";

                statusBox.textContent =
                    "✅ Haber başarıyla güncellendi!";

            }

            /*
             =========================
             YENİ HABER
             =========================
            */

            else {

                let resimUrl = null;

                if (resimDosyasi) {

                    const dosyaAdi =
                        Date.now() +
                        "-" +
                        resimDosyasi.name;

                    const uploadResponse =
                        await fetch(
                            `${SUPABASE_URL}/storage/v1/object/haberler/${dosyaAdi}`,
                            {
                                method: "POST",

                                headers: {

                                    "apikey":
                                        SUPABASE_KEY,

                                    "Authorization":
                                        `Bearer ${accessToken}`,

                                    "Content-Type":
                                        resimDosyasi.type
                                },

                                body:
                                    resimDosyasi

                            }
                        );

                    if (!uploadResponse.ok) {

                        const uploadError =
                            await uploadResponse.text();

                        throw new Error(
                            "Fotoğraf yüklenemedi: " +
                            uploadError
                        );

                    }

                    resimUrl =
                        `${SUPABASE_URL}/storage/v1/object/public/haberler/${dosyaAdi}`;

                }

                /*
                 Fotoğraf zorunlu olduğu için
                 fotoğraf seçilmemişse uyar
                */

                if (!resimUrl) {

                    throw new Error(
                        "Lütfen haber için bir fotoğraf seçin."
                    );

                }

                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/haberler`,
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`,

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify({

                                    baslik:
                                        baslik,

                                    icerik:
                                        icerik,

                                    tarih:
                                        tarih,

                                    resim:
                                        resimUrl

                                })

                        }
                    );

                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText
                    );

                }

                statusBox.className =
                    "status success";

                statusBox.textContent =
                    "✅ Haber başarıyla yayınlandı!";

            }

            /*
             =========================
             FORMU TEMİZLE
             =========================
            */

            newsForm.reset();

            document.getElementById(
                "editing-news-id"
            ).value = "";

            document.querySelector(
                ".publish-button"
            ).textContent =
                "📰 Haberi Yayınla";

            document.getElementById(
                "cancel-edit-button"
            ).style.display =
                "none";

            loadAdminNews();

        } catch (error) {

            console.error(error);

            statusBox.className =
                "status error";

            statusBox.textContent =
                "❌ Haber kaydedilemedi: " +
                error.message;

        }

    }
);
    document
    .getElementById("cancel-edit-button")
    .addEventListener(
        "click",
        function() {

            newsForm.reset();

            document.getElementById(
                "editing-news-id"
            ).value = "";

            document.querySelector(
                ".publish-button"
            ).textContent =
                "📰 Haberi Yayınla";

            this.style.display =
                "none";

            statusBox.className =
                "status";

            statusBox.textContent = "";

        }
    );

logoutButton.addEventListener(
"click",
function() {

localStorage.removeItem(
"supabase_access_token"
);

newsForm.reset();

showLoginScreen();

loginStatus.textContent =
"Çıkış yapıldı.";

loginStatus.style.color =
"#176b52";

});

</script>
