<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alınca Köyü Portalı</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f6;
    color: #263238;
    line-height: 1.6;
}

/* =========================
   ÜST MENÜ
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: linear-gradient(135deg, #176b52, #2e8b68);
    box-shadow: 0 3px 15px rgba(0,0,0,0.18);
}

.navbar {
    max-width: 1150px;
    margin: auto;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
}

.logo span {
    display: block;
    font-size: 12px;
    font-weight: normal;
    opacity: 0.85;
}

nav {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    opacity: 0.7;
}

/* =========================
   KAPAK
========================= */

.hero {
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;

    background:
        linear-gradient(rgba(10,55,40,0.65), rgba(10,55,40,0.65)),
        linear-gradient(135deg, #315f4c, #8bb69a);

    color: white;
}

.hero-content {
    max-width: 800px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 76px);
    margin-bottom: 15px;
    letter-spacing: 1px;
}

.hero p {
    font-size: 20px;
    margin-bottom: 30px;
}

.hero-button {
    display: inline-block;
    padding: 13px 25px;
    background: white;
    color: #176b52;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.hero-button:hover {
    transform: translateY(-3px);
}

/* =========================
   GENEL
========================= */

section {
    padding: 70px 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 32px;
    color: #176b52;
    margin-bottom: 8px;
}

.section-title p {
    color: #667;
}

/* =========================
   DUYURULAR
========================= */

.announcements {
    background: white;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    border: 1px solid #e7ece9;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
}

.card-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.card h3 {
    color: #176b52;
    margin-bottom: 10px;
}

.card p {
    color: #667;
}

   HABERLER
========================= */
